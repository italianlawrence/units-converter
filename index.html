<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = 'stylesheet' href = 'style.css'>
    <title> Units converter </title>
</head>
<body>
     <h1> Metric/Imperial Units Conversion </h1>   
     <input id = 'input-nmb' type = 'number' placeholder = 'Insert a number'>
     <button id = 'convert'> Convert </button>

     <section class = 'output-fields'>
        <div class = 'output-field'>
            <h2> Length (Meter-Feet)</h2>
            <p class = 'conversion' id = 'meters-in-feet'> 0 </p> |
            <p class = 'conversion' id = 'feet-in meters'> 0 </p>
        </div>

           <div class = 'output-field'>
            <h2> Volume (Liters-Gallons)</h2>
            <p class = 'conversion' id = 'liters-in-gallons'> 0 </p> |
            <p class = 'conversion' id = 'gallons-in-liters'> 0 </p>
        </div>

        <div class = 'output-field'>
            <h2> Mass (Kilograms-Pounds)</h2>
            <p class = 'conversion' id = 'kilos-in-pounds'> 0 </p> |
            <p class = 'conversion' id = 'pounds-in-kilos'> 0 </p>
        </div>

     </section>


</body>
</html>
